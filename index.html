<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DbD Random Roulette (made by SANDCATS)</title>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sandcat22.github.io/dbdrandomperk/">
    <meta property="og:title" content="DbD Random Roulette">
    <meta property="og:description" content="데드 바이 데이라이트 킬러/생존자 랜덤 퍽 & 애드온 룰렛 (Made by SANDCATS)">
    <meta property="og:image" content="https://sandcat22.github.io/dbdrandomperk/assets/perk_bg.png">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="400">

    <!-- ✅ src 폴더의 디자인(CSS) 파일 연결 -->
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="mode-killer">

    <div class="bottom-info-area">
        <button id="btnUpdateNotes" class="update-notes-btn" onclick="openUpdateNotes()">UPDATE NOTES</button>
        <div class="watermark">
            Made By SANDCATS<br>
            (V246 - Explicit HTML)<br>
            2026-06-17
        </div>
    </div>

    <!-- ✅ 모달창 및 업데이트 노트 -->
    <div class="modal-overlay" id="updateModalOverlay" onclick="closeUpdateNotes(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">UPDATE NOTES</div>
                <button class="close-modal" id="btnCloseModal" onclick="closeUpdateNotes()">&times;</button>
            </div>
            <iframe id="notesIframe" src="src/updatenotes.txt"></iframe>
        </div>
    </div>

    <!-- ✅ 타이틀 (클릭 시 모드 변경) -->
    <h1 id="headerTitle" onclick="toggleMode()">🩸 KILLER PERK 🩸</h1>

    <div id="perkWrapper">
        <div id="perkContainer">
            <div class="perk-card" id="card1">
                <img src="assets/perk_bg.png" class="perk-bg" id="bg1"><img src="" class="perk-img" id="img1">
                <div class="perk-name" id="name1"></div><div class="perk-category" id="cat1"></div>
                <div class="tier-icon-container" id="tierBox1"><img src="" id="tierImg1" class="tier-icon-img"></div>
            </div>
            <div class="perk-card" id="card2">
                <img src="assets/perk_bg.png" class="perk-bg" id="bg2"><img src="" class="perk-img" id="img2">
                <div class="perk-name" id="name2"></div><div class="perk-category" id="cat2"></div>
                <div class="tier-icon-container" id="tierBox2"><img src="" id="tierImg2" class="tier-icon-img"></div>
            </div>
            <div class="perk-card" id="card3">
                <img src="assets/perk_bg.png" class="perk-bg" id="bg3"><img src="" class="perk-img" id="img3">
                <div class="perk-name" id="name3"></div><div class="perk-category" id="cat3"></div>
                <div class="tier-icon-container" id="tierBox3"><img src="" id="tierImg3" class="tier-icon-img"></div>
            </div>
            <div class="perk-card" id="card4">
                <img src="assets/perk_bg.png" class="perk-bg" id="bg4"><img src="" class="perk-img" id="img4">
                <div class="perk-name" id="name4"></div><div class="perk-category" id="cat4"></div>
                <div class="tier-icon-container" id="tierBox4"><img src="" id="tierImg4" class="tier-icon-img"></div>
            </div>
        </div>
        
        <div id="rightPanel">
            <div class="tier-filter-container">
                <div class="filter-title">티어 필터</div>
                <button class="tier-btn active" id="btnFilter_all" onclick="setTierFilter('all')">ALL 랜덤</button>
                <button class="tier-btn" id="btnFilter_4" onclick="setTierFilter('4')">4점대 퍽</button>
                <button class="tier-btn" id="btnFilter_3" onclick="setTierFilter('3')">3점대 퍽</button>
                <button class="tier-btn" id="btnFilter_2" onclick="setTierFilter('2')">2점대 퍽</button>
                <button class="tier-btn" id="btnFilter_1" onclick="setTierFilter('1')">1점대 퍽</button>
            </div>
            
            <div class="score-container">
                <div class="avg-score-title">티어점수</div>
                <div id="averageScoreDisplay" class="avg-score">-</div>
            </div>
        </div>
    </div>

    <div id="addonWrapper">
        <div style="display: flex; gap: 30px; align-items: center; justify-content: center; width: 100%;">
            <div id="addonContainer" class="killer-addon-container">
                <div class="killer-img-container">
                    <img src="" id="mainKillerImg" class="main-killer-img">
                    <div id="mainKillerName" class="killer-name-display"></div>
                </div>
                <div style="display: flex; gap: 40px;">
                    <div class="addon-slot-container">
                        <div class="addon-slot" id="slot1"><img src="" id="adBg1" class="addon-bg-img"><img src="" id="adImg1" class="addon-img"></div>
                        <div class="addon-name" id="adName1"></div>
                    </div>
                    <div class="addon-slot-container">
                        <div class="addon-slot" id="slot2"><img src="" id="adBg2" class="addon-bg-img"><img src="" id="adImg2" class="addon-img"></div>
                        <div class="addon-name" id="adName2"></div>
                    </div>
                </div>
            </div>
            
            <div id="addonRightPanel" class="killer-list-panel">
                <div style="display:flex; gap: 10px; margin-bottom: 12px;">
                    <button id="btnRandomKiller" class="killer-list-btn random-btn" style="flex:2; margin:0; font-size: 15px; padding: 10px;" onclick="toggleRandomKiller()">
                        <span class="chk-box"></span> 다중 선택
                    </button>
                    <button id="btnSelectAllKillers" class="killer-list-btn" style="flex:1; padding: 10px; margin:0; font-size: 15px;" onclick="selectAllKillers()">ALL</button>
                </div>
                <!-- 킬러 리스트가 생성될 곳 -->
                <div id="killerListContainer" class="killer-scroll-list"></div>
            </div>
        </div>
    </div>

    <!-- ✅ 스핀 버튼 (명시적 onclick 추가) -->
    <button id="btnSpin" class="start-btn killer-btn" onclick="startSequence()">START</button>
    
    <div class="speed-control" id="speedControlBox">
        <div id="speedStatus" style="color:#ff3333">보통</div>
        <!-- ✅ 슬라이더 (명시적 oninput 추가) -->
        <input type="range" id="speedRange" min="0" max="3" value="2" step="1" oninput="updateSpeedText(this.value)">
    </div>

    <!-- ✅ 순서 주의: 무조건 data.js -> script.js 순서로 로드되어야 합니다. -->
    <script src="src/data.js"></script>
    <script src="src/script.js"></script>
</body>
</html>
