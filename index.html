<html lang="ko">

    <style>
        body {
            background-image: url('background.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.85); background-blend-mode: overlay;
            color: #ffffff; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;

        #perkContainer { display: flex; gap: 35px; align-items: center; justify-content: center; }
        
        .perk-card { width: 275px; height: 400px; background: linear-gradient(145deg, rgba(20,20,20,0.95), rgba(5,5,5,0.95)); border: 4px solid #333; border-radius: 12px; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 12px 25px rgba(0,0,0,0.9); box-sizing: border-box; }
        .perk-bg { width: 210px; height: 210px; position: absolute; top: 35px; opacity: 0.7; display: none; z-index: 1; }
        .perk-img { width: 210px; height: 210px; position: absolute; top: 35px; z-index: 2; display: none; object-fit: contain; }
        .perk-name { font-size: 24px; font-weight: bold; text-align: center; color: #ccc; margin-top: 260px; width: 100%; height: 70px; display: flex; align-items: center; justify-content: center; padding: 0 10px; line-height: 1.2; z-index: 3; text-shadow: 1px 1px 3px rgba(0,0,0,1); }
        .perk-category { font-size: 16px; color: #777; margin-top: 0px; text-align: center; z-index: 3; }
        
        .tier-icon-container { position: absolute; top: 12px; left: 12px; width: 70px; height: 70px; display: none; z-index: 10; }
        .tier-icon-img { width: 100%; height: 100%; object-fit: contain; transition: all 0.3s ease; }

        .perk-card.selected.killer_perk .tier-icon-img { filter: drop-shadow(0 0 5px #ff3333) drop-shadow(0 0 15px #ff3333); }
        .perk-card.selected.survivor_perk .tier-icon-img { filter: drop-shadow(0 0 5px #4da6ff) drop-shadow(0 0 15px #4da6ff); }

        .perk-card.spinning .perk-img, .perk-card.spinning .perk-bg { display: block; filter: blur(2px) grayscale(70%); }
        .perk-card.selected.killer_perk { border: 4px solid #ff1111; background: linear-gradient(180deg, rgba(60, 0, 0, 0.95) 0%, rgba(10, 0, 0, 1) 100%); box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 30px rgba(200, 0, 0, 0.5); }
        .perk-card.selected.survivor_perk { border: 4px solid #1166ff; background: linear-gradient(180deg, rgba(0, 20, 60, 0.95) 0%, rgba(0, 5, 10, 1) 100%); box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 30px rgba(0, 100, 255, 0.5); }
        
        #rightPanel { position: absolute; right: 50px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; justify-content: center; width: 140px; }
        
        .tier-filter-container { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .filter-title { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 2px; text-align: center; text-shadow: 1px 1px 2px #000; letter-spacing: 1px; }
        
        .tier-btn {
            padding: 12px 0; background: rgba(10, 10, 10, 0.8); border: 2px solid #2a2a2a; color: #555;
            font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer;

            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .tier-btn:hover { border-color: #444; color: #888; }

        body.mode-survivor .tier-btn.active { border-color: #003366; color: #4da6ff; background: rgba(0, 15, 40, 0.7); box-shadow: inset 0 0 10px #000, 0 0 10px rgba(0, 100, 255, 0.3); text-shadow: 0 0 5px #0088ff; }

        .avg-score { font-size: 32px; font-weight: 900; color: #333; transition: all 0.3s; letter-spacing: 1px; }
        .avg-score.show.killer-score { color: #ff3333; text-shadow: 0 0 10px #aa0000, 0 0 20px #ff0000; }
        .avg-score.show.survivor-score { color: #4da6ff; text-shadow: 0 0 10px #0044aa, 0 0 20px #0088ff; }

        #addonWrapper { display: none; align-items: center; justify-content: center; min-height: 500px; width: 100%; position: relative; }

        .main-killer-img { width: 100%; height: 260px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 51, 51, 0.4)); transition: 0.1s; }
        .main-killer-img.spinning { filter: blur(4px) grayscale(70%); transform: scale(0.95); opacity: 0.7; }
        
        .killer-name-display { font-size: 22px; font-weight: 900; color: #E040FB; text-shadow: 0 0 10px #E040FB, 0 0 20px #E040FB; text-align: center; width: 100%; min-height: 30px; transition: 0.1s; }
        .main-killer-img.spinning ~ .killer-name-display { filter: blur(2px); opacity: 0.7; }

        .addon-slot-container { display:flex; flex-direction:column; align-items:center; position: relative; flex-shrink: 0; width: 280px; }
        .addon-slot { width: 250px; height: 250px; border-radius: 12px; position: relative; display: flex; align-items: center; justify-content: center; background: #0a0a0a; border: 3px solid #333; box-shadow: inset 0 0 30px #000; box-sizing: border-box; transition: all 0.3s ease-out; margin-bottom: 25px; }
        .addon-img { position: absolute; width: 200px; height: 200px; z-index: 10; display: none; }
        .addon-bg-img { position: absolute; z-index: 1; opacity: 0.8; width: 100%; height: 100%; border-radius: 9px; }
        .addon-name { font-size: 20px; font-weight: bold; text-align: center; color: #aaa; min-height: 50px; width: 100%; line-height: 1.3; margin-top: 15px; }
        .addon-slot.selected { border: 4px solid #E040FB; box-shadow: inset 0 0 20px #000, 0 0 40px rgba(224, 64, 251, 0.5); background: #1a001a; }
        .addon-slot.selected + .addon-name { color: #E040FB; text-shadow: 0 0 10px #E040FB; }

        .killer-list-panel {
            width: 580px; height: auto; background: rgba(10, 10, 10, 0.8); border: 2px solid #2a2a2a; border-radius: 12px; 
            display: flex; flex-direction: column; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); box-sizing: border-box;
        }
        
        .killer-scroll-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; overflow: visible; }

        .killer-list-btn {
            background: rgba(20, 20, 20, 0.9); border: 1px solid #333; color: #888;
            padding: 10px 4px; border-radius: 6px; font-weight: bold; font-size: 13px;
            cursor: pointer; transition: 0.2s; text-align: center; font-family: 'Malgun Gothic', sans-serif;
            word-break: keep-all; line-height: 1.2;
        }
        .killer-list-btn:hover { border-color: #E040FB; color: #fff; }
        .killer-list-btn.active {
            border-color: #E040FB; color: #E040FB; background: rgba(224, 64, 251, 0.15);
            box-shadow: inset 0 0 8px rgba(224, 64, 251, 0.3); text-shadow: 0 0 5px #E040FB;
        }
        
        .random-btn { display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; }
        .chk-box { display: inline-block; width: 14px; height: 14px; border: 2px solid #888; border-radius: 3px; transition: 0.2s; }
        .random-btn.active .chk-box { background: #E040FB; border-color: #E040FB; box-shadow: 0 0 8px #E040FB; }

        button.start-btn { margin-top: 30px; padding: 15px 80px; font-size: 30px; color: white; border-radius: 50px; cursor: pointer; font-weight: 900; transition: all 0.3s; border: 3px solid transparent; }
        button.start-btn:disabled { background-color: #222 !important; border-color: #444 !important; color: #555 !important; cursor: not-allowed; box-shadow: none; }
        button.killer-btn { background-color: #660000; border-color: #cc0000; box-shadow: 0 0 20px rgba(200, 0, 0, 0.4); }
        button.survivor-btn { background-color: #003366; border-color: #0066cc; box-shadow: 0 0 20px rgba(0, 100, 200, 0.4); }
        button.addon-btn { background-color: #4a0d75; border-color: #9900ff; box-shadow: 0 0 20px rgba(150, 0, 255, 0.4); }
        
        .speed-control { display: flex; flex-direction: column; align-items: center; width: 200px; margin-top: 15px; transition: opacity 0.3s; }
        #speedStatus { font-size: 20px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 5px currentColor; }
        input[type=range] { width: 100%; cursor: pointer; transition: 0.3s; }
        
        .bottom-info-area { position: fixed; bottom: 20px; right: 30px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 1000; user-select: none; }
        .watermark { color: rgba(255, 255, 255, 0.95); font-size: 15px; font-weight: 900; text-align: right; line-height: 1.5; pointer-events: none; text-shadow: 2px 2px 5px rgba(0, 0, 0, 1); }
        
        .update-notes-btn { background: rgba(30, 0, 50, 0.8); border: 2px solid #8e24aa; color: #ce93d8; font-weight: bold; font-size: 14px; padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.3s; text-shadow: 0 0 5px #ea80fc; box-shadow: 0 0 10px rgba(142, 36, 170, 0.3); font-family: 'Malgun Gothic', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .update-notes-btn:hover { background: rgba(50, 0, 80, 1); border-color: #ce93d8; color: #fff; box-shadow: 0 0 20px rgba(206, 147, 216, 0.6); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { background: linear-gradient(145deg, #151515, #0a0a0a); border: 3px solid #8e24aa; width: 700px; max-height: 80vh; border-radius: 12px; box-shadow: 0 0 50px rgba(142, 36, 170, 0.5); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .modal-header { padding: 15px 20px; background: rgba(142, 36, 170, 0.2); border-bottom: 2px solid #8e24aa; display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 20px; font-weight: bold; color: #ea80fc; text-shadow: 0 0 10px #ea80fc; font-family: 'Malgun Gothic', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .close-modal { background: none; border: none; color: #888; font-size: 28px; cursor: pointer; line-height: 1; padding: 0; margin-top: -5px; transition: 0.2s; }
        .close-modal:hover { color: #fff; transform: scale(1.1); }
        .modal-body { padding: 25px; overflow-y: auto; color: #ccc; font-size: 15px; line-height: 1.7; white-space: pre-wrap; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; }
        
        .modal-body::-webkit-scrollbar { width: 8px; }
        .modal-body::-webkit-scrollbar-track { background: #1a1a1a; }
        .modal-body::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .modal-body::-webkit-scrollbar-thumb:hover { background: #8e24aa; }
    </style>
</head>

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // ✅ V225: 1점대 픽 에러를 없애고 속도를 높인 스마트 추출 함수
        function getRandomPerks(data, filterVal) {
            if (filterVal === 'all') {
                let tempArray = [...data];
                shuffleArray(tempArray);
                return tempArray.slice(0, 4);
            }

            let pools = { 1: [], 2: [], 3: [], 4: [], 5: [] };
            data.forEach(p => { if (pools[p.tier]) pools[p.tier].push(p); });

            let minSum = 0, maxSum = 20, targetTiers = [];
            if (filterVal === '4') { minSum = 16; maxSum = 20; targetTiers = [3, 4, 4, 5, 5]; }
            else if (filterVal === '3') { minSum = 12; maxSum = 15; targetTiers = [2, 3, 3, 4, 4]; }
            else if (filterVal === '2') { minSum = 8; maxSum = 11; targetTiers = [1, 2, 2, 3, 3]; }
            else if (filterVal === '1') { minSum = 4; maxSum = 7; targetTiers = [1, 1, 2]; }

            let attempts = 0;
            while(attempts < 2000) {
                attempts++;
                let selectedTiers = [];
                for(let i=0; i<4; i++) {
                    selectedTiers.push(targetTiers[Math.floor(Math.random() * targetTiers.length)]);
                }
                
                let sum = selectedTiers.reduce((a,b) => a+b, 0);
                if (sum >= minSum && sum <= maxSum) {
                    let combo = [];
                    let usedIndices = { 1:new Set(), 2:new Set(), 3:new Set(), 4:new Set(), 5:new Set() };
                    let isValid = true;
                    
                    for(let t of selectedTiers) {
                        let pool = pools[t];
                        if (pool.length === 0 || usedIndices[t].size >= pool.length) {
                            isValid = false; break;
                        }
                        let r;
                        do { r = Math.floor(Math.random() * pool.length); } while(usedIndices[t].has(r));
                        usedIndices[t].add(r);
                        combo.push(pool[r]);
                    }
                    if (isValid) return combo;
                }
            }
            
            // 만약 실패하더라도 무조건 4개를 반환하여 에러 메시지 방지
            let tempArray = [...data];
            shuffleArray(tempArray);
            return tempArray.slice(0, 4);
        }

        let spinTick = 0; // 스핀 프레임용 변수

        function startSequence() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('btnSpin').disabled = true;
            let activeData, path, type;
            let finalKillerId; 

            if (currentMode === 'killer_perk') { activeData = killerPerkData; path = PATHS.PERK_K; type = 'perk'; }
            else if (currentMode === 'survivor_perk') { activeData = survivorPerkData; path = PATHS.PERK_S; type = 'perk'; }
            else { type = 'addon'; }

            resetSlots(); 

            if (type === 'perk') {
                for(let i=1; i<=4; i++) {
                    const card = document.getElementById(`card${i}`);
                    card.classList.remove('selected', 'killer_perk', 'survivor_perk');
                    card.classList.add('spinning');
                    spinPerk(i, activeData, path);
                }
            } else {
                if (isRandomKiller && selectedKillers.length > 0) {
                    const killerImg = document.getElementById('mainKillerImg');
                    const killerName = document.getElementById('mainKillerName');
                    killerImg.classList.add('spinning');
                    
                    spinIntervals['killer'] = setInterval(() => {
                        const tempId = selectedKillers[Math.floor(Math.random() * selectedKillers.length)];
                        killerImg.src = `${PATHS.PORTRAIT}${tempId}.webp`;
                        killerName.innerText = killerNameMap[tempId];
                    }, 80);
                }

                for(let i=1; i<=2; i++) {
                    const slot = document.getElementById(`slot${i}`);
                    slot.classList.remove('selected'); slot.classList.add('spinning');
                    let spinData = killerAddons['trapper']; 
                    let spinPath = `${PATHS.ADDON}trapper/`;
                    spinAddon(i, spinData, spinPath); 
                }
            }

            if (type === 'addon') {
                setTimeout(() => {
                    if (isRandomKiller && selectedKillers.length > 0) {
                        clearInterval(spinIntervals['killer']);
                        finalKillerId = selectedKillers[Math.floor(Math.random() * selectedKillers.length)];
                        const killerImg = document.getElementById('mainKillerImg');
                        killerImg.classList.remove('spinning');
                        killerImg.src = `${PATHS.PORTRAIT}${finalKillerId}.webp`;
                        document.getElementById('mainKillerName').innerText = killerNameMap[finalKillerId];
                    } else {
                        finalKillerId = selectedKillers[0] || 'trapper';
                        document.getElementById('mainKillerName').innerText = killerNameMap[finalKillerId];
                    }

                    activeData = killerAddons[finalKillerId];
                    let folderId = finalKillerId === 'theFirst' ? 'theFirst' : finalKillerId;
                    path = `${PATHS.ADDON}${folderId}/`;

                    if (!activeData || activeData.length === 0) {
                        for(let i=1; i<=2; i++) clearInterval(spinIntervals[`a${i}`]);
                        resetSlots(); alert(`데이터가 없습니다.`); finalize();
                    } else {
                        const shuffled = [...activeData];
                        shuffleArray(shuffled);
                        stopAddon(1, shuffled[0], path); 
                        stopAddon(2, shuffled[1], path);
                        finalize();
                    }
                }, 1000); 
            } else {
                const speedVal = parseInt(document.getElementById('speedRange').value);
                const currentDelay = [0, 600, 1300, 2600][speedVal];
                
                // ✅ V225: 빠르고 정확하게 랜덤 조합 추출
                let shuffledPerks = getRandomPerks(activeData, currentTierFilter);
                currentSpunPerks = shuffledPerks;

                if (speedVal === 0) { 
                    setTimeout(() => {
                        for(let i=1; i<=4; i++) stopPerk(i, shuffledPerks[i-1], path);
                        finalize();
                    }, 500);
                } else { 
                    let currentIdx = 1;
                    const stopSequentially = () => {
                        stopPerk(currentIdx, shuffledPerks[currentIdx-1], path);
                        if (currentIdx === 4) { finalize(); return; }
                        currentIdx++; setTimeout(stopSequentially, currentDelay);
                    };
                    setTimeout(stopSequentially, 1000);
                }
            }
        }

        // ✅ V225: 렉 방지를 위해 미리 캐싱된 앞부분 15개 이미지 안에서만 스핀 연출
        function spinPerk(idx, data, path) {
             spinIntervals[`p${idx}`] = setInterval(() => {
                 spinTick++;
                 const rnd = data[spinTick % 15]; 
                 const img = document.getElementById(`img${idx}`);
                 img.src = path + rnd.file; img.style.display = 'block'; 
                 document.getElementById(`bg${idx}`).style.display = 'block';
                 document.getElementById(`name${idx}`).innerText = rnd.name;
                 document.getElementById(`cat${idx}`).innerText = rnd.category;
             }, 50);
        }

        function stopPerk(idx, item, path) {
            clearInterval(spinIntervals[`p${idx}`]);
            const img = document.getElementById(`img${idx}`);
            img.src = path + item.file; img.style.display = 'block'; 
            document.getElementById(`name${idx}`).innerText = item.name;
            document.getElementById(`cat${idx}`).innerText = item.category;
            
            const card = document.getElementById(`card${idx}`);
            card.classList.remove('spinning'); 
            card.classList.add('selected', currentMode);

            const tierBox = document.getElementById(`tierBox${idx}`);
            const tierImg = document.getElementById(`tierImg${idx}`);
            const tierNum = item.tier || 3;
            
            tierImg.src = `tier_logo${tierNum}.png`;
            tierBox.style.display = 'block';
        }

        function spinAddon(idx, data, path) {
            spinIntervals[`a${idx}`] = setInterval(() => {
                spinTick++;
                const rnd = data[spinTick % Math.min(10, data.length)];
                if(!rnd) return;
                const img = document.getElementById(`adImg${idx}`);
                img.src = path + rnd.file; img.style.display = 'block'; 
                const bg = document.getElementById(`adBg${idx}`);
                bg.src = PATHS.ADDON_BG + rarityBgs[rnd.rarity]; bg.style.display = 'block';
                document.getElementById(`adName${idx}`).innerText = rnd.name;
            }, 80);
        }

        function stopAddon(idx, item, path) {
            clearInterval(spinIntervals[`a${idx}`]);
            if(!item) return;
            const img = document.getElementById(`adImg${idx}`);
            img.src = path + item.file; img.style.display = 'block';
            document.getElementById(`adBg${idx}`).src = PATHS.ADDON_BG + rarityBgs[item.rarity];
            document.getElementById(`adName${idx}`).innerText = item.name;
            document.getElementById(`slot${idx}`).classList.remove('spinning');
            document.getElementById(`slot${idx}`).classList.add('selected');
        }

        function finalize() { 
            isSpinning = false; 
            document.getElementById('btnSpin').disabled = false; 
            
            if (currentMode !== 'killer_addon' && currentSpunPerks && currentSpunPerks.length === 4) {
                let avg = (currentSpunPerks[0].tier + currentSpunPerks[1].tier + currentSpunPerks[2].tier + currentSpunPerks[3].tier) / 4;
                const scoreDisplay = document.getElementById('averageScoreDisplay');
                scoreDisplay.innerText = avg.toFixed(2);
                scoreDisplay.className = `avg-score show ${currentMode === 'killer_perk' ? 'killer-score' : 'survivor-score'}`;
            }
        }
        
        function updateSpeedText() {
            const val = document.getElementById('speedRange').value;

            document.getElementById('speedStatus').innerText = texts[val];
        }

        const NOTE_FILENAME = 'updatenotes.txt';

        function openUpdateNotes() {
            const modal = document.getElementById('updateModalOverlay');
            const body = document.getElementById('updateModalBody');
            
            modal.classList.add('show');
            body.innerText = "로딩 중...";

            fetch(NOTE_FILENAME, { cache: "no-store" })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('파일을 찾을 수 없습니다.');
                    }
                    return response.text();
                })
                .then(text => {
                    body.innerText = text;
                })
                .catch(error => {
                    console.log("로컬 보안 정책(CORS) 감지됨. iframe 대체 모드로 실행합니다.");
                    body.innerHTML = `
                        <div style="margin-bottom:10px; font-size:13px; color:#ffaaaa;">
                            ※ 로컬(내 컴퓨터) 테스트 환경이라 임시 모드로 출력되었습니다.<br>깃허브에 올리면 더 깔끔하게 나옵니다.
                        </div>
                        <iframe src="${NOTE_FILENAME}" style="width:100%; height:400px; border:none; background:#fff; filter: invert(0.92) hue-rotate(180deg); border-radius: 8px;"></iframe>
                    `;
                });
        }

        function closeUpdateNotes(event) {
            if(!event || event.target.id === 'updateModalOverlay' || event.target.className === 'close-modal') {
                document.getElementById('updateModalOverlay').classList.remove('show');
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                const modal = document.getElementById('updateModalOverlay');
                if(modal.classList.contains('show')) {
                    closeUpdateNotes();
                }
            }
        });

        renderKillerPicker();
        updateInterface();
        document.getElementById('perkWrapper').style.display = 'flex'; 
    </script>
</body>
</html>
